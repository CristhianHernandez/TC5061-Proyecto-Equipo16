name: MiBici - CI/CD Operacion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Pruebas y calidad
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Validar codigo con Ruff
        run: |
          python -m ruff check mibici/
          python -m ruff format --check mibici/

      - name: Ejecutar pruebas
        run: python -m pytest -q

  despliegue:
    name: Build y despliegue de prueba
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Construir y probar stack
        env:
          IMAGEN_TAG: ${{ github.sha }}
          MANTENER: '1'
        run: bash scripts/smoke_compose.sh

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=100 || true

      - name: Limpiar stack
        if: always()
        run: docker compose down -v --remove-orphans || true
