[pytest]
# Comando único desde la raíz del repositorio: python -m pytest tests/ -q
testpaths = tests
# -ra resume al final las pruebas omitidas o fallidas; --strict-markers rechaza marcas mal escritas
addopts = -ra --strict-markers
markers =
    reproducibilidad: verifica que el entrenamiento con la semilla fija produce los mismos resultados
    integracion: recorre varias etapas (entrenamiento, MLflow y registro) con datos sintéticos
    limite: casos límite (entradas vacías, parámetros inválidos o esquema incompatible)
    deepchecks: validaciones de calidad de datos con DeepChecks
